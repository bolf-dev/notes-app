# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Maps domain exceptions to HTTP responses, so the domain layer stays HTTP-agnostic
    exceptions:
        App\Exception\NoteNotFoundException:
            status_code: 404
            log_level: info

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
